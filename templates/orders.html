{% extends "base.html" %}
{% block content %}
<h1>Meus pedidos</h1><div class="cards">{% for o in orders %}<a class="panel" href="/pedido/{{o.id}}"><h2>Pedido #{{o.id}}</h2><p>{{o.status}}</p><strong>{{money(o.total)}}</strong></a>{% else %}<p>Nenhum pedido ainda.</p>{% endfor %}</div>
{% endblock %}
